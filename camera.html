<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Face Capture</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; background: #111; color: #fff; margin: 0; padding: 20px; text-align: center; }
    .video-box { width: 100%; max-width: 420px; aspect-ratio: 4/3; background: #000; border-radius: 12px; overflow: hidden; margin: 16px auto; }
    video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    #status { font-size: 15px; color: #ccc; min-height: 20px; }
  </style>
</head>
<body>
  <h2>Look at the camera</h2>
  <div class="video-box"><video id="video" autoplay muted playsinline></video></div>
  <p id="status">Loading…</p>
  
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <script>
    const MODEL_URL = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@0.22.2/weights';
    const statusEl = document.getElementById('status');
    const video = document.getElementById('video');
    let stream = null;
    let scanTimer = null;

    async function init() {
      try {
        statusEl.textContent = 'Loading face recognition models…';
        await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
        await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
        await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
      } catch (e) {
        statusEl.textContent = 'Could not load models. Check your internet connection.';
        return;
      }

      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
        video.srcObject = stream;
      } catch (e) {
        statusEl.textContent = 'Camera access denied. Please allow camera access in your browser and reload this tab.';
        return;
      }

      statusEl.textContent = 'Hold still — scanning…';
      let attempts = 0;
      const maxAttempts = 40;

      scanTimer = setInterval(async () => {
        attempts++;
        const detection = await faceapi
          .detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
          .withFaceLandmarks()
          .withFaceDescriptor();

        if (detection) {
          clearInterval(scanTimer);
          stopCamera();
          statusEl.textContent = 'Captured ✅ Sending back…';
          const descriptor = Array.from(detection.descriptor);
          
          if (window.opener) {
            window.opener.postMessage({ type: 'FACE_DESCRIPTOR', descriptor: descriptor }, '*');
          }
          setTimeout(() => window.close(), 1000);
          return;
        }

        if (attempts >= maxAttempts) {
          clearInterval(scanTimer);
          stopCamera();
          statusEl.textContent = 'No face detected. Please try again in better lighting.';
        }
      }, 500);
    }

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
    }

    init();
  </script>
</body>
</html>
